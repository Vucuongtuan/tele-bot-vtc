services:
  - type: web
    name: tele-bot-vtc
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PAYLOAD_API_URL
        value: https://wowweekend.vn/api
      - key: PAYLOAD_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: NEWSLETTER_GITHUB_REPOSITORY
        sync: false
      - key: NEWSLETTER_GITHUB_BRANCH
        value: main
